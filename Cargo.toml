[workspace]
members = [
    "crates/shared",
    "crates/client",
]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
bevy = "0.17.2"
bevy_renet = "3.0.0"
bincode = { version = "2.0.1", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }

